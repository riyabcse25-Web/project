<!DOCTYPE html>
<html lang="en">
<head>
    <title>Brew & Bean Café</title>

  
  <link rel="stylesheet" href="file.css">
</head>
<body>

<div class="container">
  <div class="gallery">
    <img src="https://images.unsplash.com/photo-1461023058943-07fcbe16d735?w=200&h=150&fit=crop" alt="Cappuccino">
    <img src="https://images.unsplash.com/photo-1442512595331-e89e73853f31?w=200&h=150&fit=crop" alt="Latte">
  </div>
  <form id="orderForm">


    <label>Select Coffee:</label><br>
    <select id="coffee" onchange="updateOrder()">
      <option value="100">Espresso (₹100)</option>
      <option value="150">Cappuccino (₹150)</option>
      <option value="180">Latte (₹180)</option>
      <option value="120">Americano (₹120)</option>
      <option value="200">Mocha (₹200)</option>
      <option value="160">Macchiato (₹160)</option>
      <option value="170">Flat White (₹170)</option>
      <option value="190">Affogato (₹190)</option>
      <option value="140">Cold Brew (₹140)</option>
      <option value="220">Frappuccino (₹220)</option>
    </select><br><br>


    <label>Add-ons:</label><br>
    <input type="checkbox" value="20" onchange="updateOrder()"> Extra Sugar (₹20)<br>
    <input type="checkbox" value="30" onchange="updateOrder()"> Whipped Cream (₹30)<br>
    <input type="checkbox" value="40" onchange="updateOrder()"> Chocolate Syrup (₹40)<br>
    <input type="checkbox" value="35" onchange="updateOrder()"> Vanilla Syrup (₹35)<br>
    <input type="checkbox" value="50" onchange="updateOrder()"> Caramel Syrup (₹50)<br>
    <input type="checkbox" value="25" onchange="updateOrder()"> Honey (₹25)<br>
    <input type="checkbox" value="30" onchange="updateOrder()"> Cinnamon (₹30)<br>
    <input type="checkbox" value="35" onchange="updateOrder()"> Hazelnut Syrup (₹35)<br>
    <input type="checkbox" value="20" onchange="updateOrder()"> Almond Milk (₹20)<br>
    <input type="checkbox" value="20" onchange="updateOrder()"> Oat Milk (₹20)<br>
    <input type="checkbox" value="25" onchange="updateOrder()"> Coconut Milk (₹25)<br>
    <input type="checkbox" value="40" onchange="updateOrder()"> Extra Espresso Shot (₹40)<br><br>


    <label>Quantity:</label><br>
    <input type="number" id="qty" value="1" min="1" onchange="updateOrder()"><br><br>

  </form>


  <div class="summary">
    <h3>Order Summary</h3>
    <p id="summaryText">Select your order</p>
    <h3>Total: ₹<span id="total">0</span></h3>
  </div>
</div>

<script>
function updateOrder() {
  let coffee = document.getElementById("coffee");
  let coffeePrice = parseInt(coffee.value);
  let coffeeName = coffee.options[coffee.selectedIndex].text;

  let checkboxes = document.querySelectorAll("input[type='checkbox']");
  let addons = [];
  let addonTotal = 0;

  checkboxes.forEach(cb => {
    if (cb.checked) {
      addons.push(cb.parentElement.textContent.trim());
      addonTotal += parseInt(cb.value);
    }
  });

  let qty = parseInt(document.getElementById("qty").value);

  let total = (coffeePrice + addonTotal) * qty;

  document.getElementById("summaryText").innerHTML =
    "Coffee: " + coffeeName + "<br>" +
    "Add-ons: " + (addons.length ? addons.join(", ") : "None") + "<br>" +
    "Quantity: " + qty;

  document.getElementById("total").innerText = total;
}
</script>
<section id="contact" class="mb-5">
    <h2 class="mb-3">Contact Information</h2>

    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">

            <form class="bg-light-cream p-4 rounded shadow-sm">

                <!-- Name -->
                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input type="text" class="form-control" placeholder="Enter your name">
                </div>

                <!-- Mobile -->
                <div class="mb-3">
                    <label class="form-label">Mobile Number</label>
                    <input type="tel" class="form-control" placeholder="Enter your mobile number">
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" placeholder="Enter your email">
                </div>

                <!-- Message -->
                <div class="mb-3">
                    <label class="form-label">Message</label>
                    <textarea class="form-control" rows="3" placeholder="Write your message"></textarea>
                </div>

                <!-- Button -->
                <div class="d-grid">
                    <button type="submit" class="btn text-white" style="background:#6f4e37;">
                        Submit
                    </button>
                </div>

            </form>

        </div>
    </div>
</section>

</body>
</html>
